[project]
name = "harness-engineering-workshop"
version = "0.1.0"
description = "Workshop DevFest: Sotto il cofano degli AI agent - harness engineering in pratica con Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.13.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: live integration tests making real LLM calls (requires API key)",
]

